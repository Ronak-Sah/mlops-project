name: CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
      

    - name: install dependencies
      run: |
        pip install -r requirements.txt
          


    - name: Configure DVC Remote
      env:
        dagshub_s3_access_key_id: ${{ secrets.DAGSHUB_S3_ACCESS_KEY_ID }}
        dagshub_s3_secret_key_id: ${{ secrets.DAGSHUB_S3_SECRET_KEY_ID }}
        dagshub_s3_endpoint_url: ${{ secrets.DAGSHUB_S3_ENDPOINT_URL }}
        dagshub_s3_region: ${{ secrets.DAGSHUB_S3_REGION }}
      run: 
        dvc remote modify origin url ${{ secrets.DAGSHUB_S3_ENDPOINT_URL }}
        dvc remote modify origin endpointurl ${{ secrets.DAGSHUB_S3_ENDPOINT_URL }}
        dvc remote modify origin --local access_key_id ${{ secrets.DAGSHUB_ACCESS_KEY_ID }}
        dvc remote modify origin --local secret_access_key ${{ secrets.DAGSHUB_SECRET_ACCESS_KEY }}
        dvc remote modify origin --local region ${{ secrets.DAGSHUB_S3_REGION }}
        

        
    - name: Tests with pytest
      env:
        mongo_db_url: ${{ secrets.MONGO_DB_URL }}
      run: |
        pytest tests/ -x

    - name: Run pipeline
      env:
        mongo_db_url: ${{ secrets.MONGO_DB_URL }}
        dagshub_uri: ${{secrets.DAGSHUB_URI}}
        mlflow_tracking_username: ${{secrets.MLFLOW_TRACKING_USERNAME}}
        mlflow_tracking_password: ${{secrets.MLFLOW_TRACKING_PASSWORD}}
      run: dvc repro

    - name: Pull data using DVC
      run: 
        dvc pull

