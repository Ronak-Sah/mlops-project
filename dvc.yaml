stages:
  data_ingestion:
    cmd: python -m src.components.data_ingestion
    deps:
      - src/components/data_ingestion.py
      - src/components/data_ingestion.py
      - src/configuration
      - config
    outs:
      - artifacts/data_ingestion/train
      - artifacts/data_ingestion/test
      - artifacts/data_ingestion/val

  data_validation:
    cmd: python -m src.components.data_validation
    deps:
      - src/components/data_validation.py
      - src/configuration
      - artifacts/data_ingestion/train
      - artifacts/data_ingestion/test
      - artifacts/data_ingestion/val
      - config/schema.yaml
    outs:
      - artifacts/data_validation

  data_transformation:
    cmd: python -m src.components.data_transformation
    deps:
      - src/components/data_transformation.py
      - src/configuration
      - artifacts/data_ingestion/train
      - artifacts/data_ingestion/test
      - artifacts/data_ingestion/val

    outs:
      - artifacts/data_transformation

  model_trainer:
    cmd: python -m src.components.model_trainer
    deps:
      - src/components/model_trainer.py
      - src/configuration
      - artifacts/data_transformation
    outs:
      - artifacts/model_trainer/model.pkl
    metrics:
      - artifacts/model_trainer/metrics.json:
          cache: false